<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Happy Anniversary ❤️</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: #ffe6f0;
  padding: 20px;
  overflow-x: hidden;
}

.question {
  margin-top: 60px;
}

button {
  margin: 6px;
  padding: 10px 15px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
}

.hidden {
  display: none;
}

img {
  width: 250px;
  margin-top: 10px;
  border-radius: 12px;
}

/* popup */
#popup {
  position: fixed;
  top:0;left:0;
  width:100%;
  height:100%;
  background:black;
  color:white;
  display:none;
  justify-content:center;
  align-items:center;
  text-align:center;
  font-size:24px;
  z-index:999;
}

/* fireworks */
canvas {
  position: fixed;
  top:0;
  left:0;
  pointer-events:none;
}
</style>

</head>

<body>

<h1>❤️ Happy Anniversary ❤️</h1>

<audio id="loveSound"
src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_5a0db9b1f6.mp3?filename=romantic-love-ambient-110863.mp3">
</audio>

<!-- Q1 -->
<div id="q1" class="question">
<h3>How did you fall for me?</h3>
<button onclick="next(2)">Slowly</button>
<button onclick="next(2)">All at once</button>
<button onclick="next(2)">It just happened</button>
<button onclick="next(2)">You hacked my heart</button>
</div>

<!-- Q2 -->
<div id="q2" class="question hidden">
<h3>What do you do when you miss me?</h3>
<button onclick="showImage()">Text me</button>
<button onclick="showImage()">Think about me</button>
<button onclick="showImage()">Smile like an idiot</button>
<button onclick="showImage()">All of the above</button>

<div id="imgArea"></div>
</div>

<!-- Q3 -->
<div id="q3" class="question hidden">
<h3>What do you want us to do today?</h3>

<button onclick="error404()">Cute Date</button>
<button onclick="error404()">Long Drive</button>
<button onclick="error404()">Stay in & do nothing</button>
<button onclick="error404()">Surprise me</button>

<div id="errArea"></div>
</div>

<!-- Q4 -->
<div id="q4" class="question hidden">
<h3>Do you love me?</h3>
<button onclick="love()">Yes ❤️</button>
<button disabled>No</button>
</div>

<!-- Q5 -->
<div id="q5" class="question hidden">
<h3>Leave a message when I'm dramatic</h3>
<textarea rows="4" cols="30"></textarea>
<button onclick="next(6)">Continue</button>
</div>

<!-- Agreement -->
<div id="q6" class="question hidden">
<h3>By submitting you agree to:</h3>
<p>Love me, be mine & deal with my nonsense forever 😜</p>

<button onclick="finish()">I Accept ❤️</button>
<button disabled>No</button>
</div>

<h2 id="finalMsg"></h2>

<div id="popup">
<div>
❤️ This field is locked for your safety ❤️
<br><br>
<button onclick="closePopup()">Continue</button>
</div>
</div>

<canvas id="fireworks"></canvas>

<script>
const sound = document.getElementById("loveSound");

function playSound(){
  sound.currentTime = 0;
  sound.play();
}

function next(num){
  playSound();
  document.getElementById("q"+num)
    .classList.remove("hidden");

  document.getElementById("q"+num)
    .scrollIntoView({behavior:"smooth"});
}

function showImage(){
  playSound();
  document.getElementById("imgArea").innerHTML =
  "<img src='couple.jpg'>";
  next(3);
}

function error404(){
  playSound();
  document.getElementById("errArea").innerHTML =
  "<h3>Error 404 😜 Plan not found</h3>";
  next(4);
}

function love(){
  playSound();
  document.getElementById("popup").style.display="flex";
}

function closePopup(){
  document.getElementById("popup").style.display="none";
  next(5);
}

function finish(){
  playSound();
  document.getElementById("finalMsg").innerHTML =
  "🎉❤️ Happy Anniversary Pattu ❤️🎉";
  startFireworks();
}

/* Fireworks */
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.onresize = resize;

let particles = [];

function startFireworks(){
  setInterval(()=>{
    for(let i=0;i<30;i++){
      particles.push({
        x: canvas.width/2,
        y: canvas.height/2,
        vx: (Math.random()-0.5)*6,
        vy: (Math.random()-0.5)*6,
        life: 60
      });
    }
  },800);

  animate();
}

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  particles.forEach(p=>{
    p.x += p.vx;
    p.y += p.vy;
    p.life--;

    ctx.fillStyle =
      "hsl(" + Math.random()*360 + ",100%,60%)";
    ctx.fillRect(p.x,p.y,4,4);
  });

  particles = particles.filter(p=>p.life>0);
  requestAnimationFrame(animate);
}
</script>

</body>
</html>
