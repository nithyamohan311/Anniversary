<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Happy Anniversary</title>

<style>
body{
font-family:Arial;
text-align:center;
background:#ffe6f0;
padding:20px;
overflow-x:hidden;
}

.question{margin-top:60px;}

button{
margin:6px;
padding:10px 15px;
border-radius:8px;
border:none;
cursor:pointer;
}

.hidden{display:none;}

img{width:260px;border-radius:12px;margin-top:10px;}

#popup{
position:fixed;
top:0;left:0;
width:100%;
height:100%;
background:black;
color:white;
display:none;
justify-content:center;
align-items:center;
text-align:center;
z-index:999;
font-size:24px;
}

canvas{
position:fixed;
top:0;left:0;
pointer-events:none;
}
</style>

</head>

<body>

<h1>❤️ Happy Anniversary ❤️</h1>

<audio id="sound"
src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_5a0db9b1f6.mp3">
</audio>

<!-- Q1 -->
<div id="q1" class="question">
<h3>How did you fall for me?</h3>

<button onclick="q1()">Slowly</button>
<button onclick="q1()">All at once</button>
<button onclick="q1()">It just happened</button>
<button onclick="q1()">You hacked my heart</button>
</div>

<!-- Q2 -->
<div id="q2" class="question hidden">
<h3>What do you do when you miss me?</h3>

<button onclick="q2()">Text me</button>
<button onclick="q2()">Think about me</button>
<button onclick="q2()">Smile like an idiot</button>
<button onclick="q2()">All of the above</button>

<div id="imgArea"></div>
</div>

<!-- Q3 -->
<div id="q3" class="question hidden">
<h3>What do you want us to do today?</h3>

<button onclick="q3()">Cute Date</button>
<button onclick="q3()">Long Drive</button>
<button onclick="q3()">Stay in & do nothing</button>
<button onclick="q3()">Surprise me</button>

<div id="err"></div>
</div>

<!-- Q4 -->
<div id="q4" class="question hidden">
<h3>Do you love me?</h3>
<button onclick="loveYes()">Yes ❤️</button>
<button onclick="loveNo()">No</button>
</div>

<!-- Q5 -->
<div id="q5" class="question hidden">
<h3>Leave a message when I'm dramatic</h3>
<textarea rows="4" cols="30"></textarea><br>
<button onclick="showOnly(6)">Continue</button>
</div>

<!-- Q6 -->
<div id="q6" class="question hidden">
<h3>By submitting you agree to:</h3>
<p>Love me, be mine & deal with my nonsense forever 😜</p>
<button onclick="finish()">I Accept ❤️</button>
</div>

<h2 id="final"></h2>

<div id="popup">
<div>
<p id="popupText"></p>
<button onclick="closePopup()">Continue</button>
</div>
</div>

<canvas id="fire"></canvas>

<script>
const sound=document.getElementById("sound");

function play(){
sound.currentTime=0;
sound.play();
}

function showOnly(num){
for(let i=1;i<=6;i++){
let el=document.getElementById("q"+i);
if(el) el.classList.add("hidden");
}
document.getElementById("q"+num)
.classList.remove("hidden");

document.getElementById("q"+num)
.scrollIntoView({behavior:"smooth"});
}

/* Q1 */
function q1(){
play();
popup("❤️❤️❤️");
nextAfterPopup=2;
}

/* Q2 */
function q2(){
play();
document.getElementById("imgArea").innerHTML=
"<img src='couple.jpg'>";
setTimeout(()=>showOnly(3),600);
}

/* Q3 */
function q3(){
play();
document.getElementById("err").innerHTML=
"<h3>Error 404 😜 Plan not found</h3>";
setTimeout(()=>showOnly(4),600);
}

/* Love question */
function loveNo(){
play();
popup("❤️ This field is locked for your safety ❤️");
nextAfterPopup=4;
}

function loveYes(){
play();
popup("😎 That's my boy ❤️");
nextAfterPopup=5;
}

/* popup system */
let nextAfterPopup=0;

function popup(text){
document.getElementById("popupText").innerHTML=text;
document.getElementById("popup").style.display="flex";
}

function closePopup(){
document.getElementById("popup").style.display="none";
if(nextAfterPopup)
showOnly(nextAfterPopup);
}

/* Finish */
function finish(){
play();
document.getElementById("final").innerHTML=
"🎉❤️ Happy Anniversary Pattu ❤️🎉";
fireworks();
}

/* fireworks */
const canvas=document.getElementById("fire");
const ctx=canvas.getContext("2d");

function resize(){
canvas.width=innerWidth;
canvas.height=innerHeight;
}
resize();
window.onresize=resize;

let parts=[];

function fireworks(){
setInterval(()=>{
for(let i=0;i<30;i++){
parts.push({
x:canvas.width/2,
y:canvas.height/2,
vx:(Math.random()-0.5)*6,
vy:(Math.random()-0.5)*6,
life:60
});
}
},800);
animate();
}

function animate(){
ctx.clearRect(0,0,canvas.width,canvas.height);

parts.forEach(p=>{
p.x+=p.vx;
p.y+=p.vy;
p.life--;

ctx.fillStyle=
"hsl("+Math.random()*360+",100%,60%)";
ctx.fillRect(p.x,p.y,4,4);
});

parts=parts.filter(p=>p.life>0);
requestAnimationFrame(animate);
}
</script>

</body>
</html>
