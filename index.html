<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Anniversary 2026</title>

<style>
body{
font-family:Arial;
text-align:center;
background:#ffe6f0;
margin:0;
overflow:hidden;
}
.center{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:100%;
}
.question{margin-top:40px;}
.hidden{display:none;}
button{
margin:8px;
padding:12px 18px;
border-radius:10px;
border:none;
cursor:pointer;
font-size:18px;
}
textarea{font-size:18px;}
h1,h3{font-size:32px;}
img{
width:300px;
border-radius:12px;
margin-top:10px;
}
#popup{
position:fixed;
top:0;left:0;
width:100%;
height:100%;
background:black;
color:white;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
z-index:999;
font-size:30px;
}
canvas{
position:fixed;
top:0;
left:0;
pointer-events:none;
}
</style>

<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
(function(){
emailjs.init("YOUR_PUBLIC_KEY");
})();
</script>

</head>

<body>

<div class="center">

<h1>🥂 Anniversary 2026 🥂</h1>

<audio id="bgm" loop>
<source src="Eppadi_Vandhaayo.mp3" type="audio/mpeg">
</audio>

<div id="q1" class="question hidden">
<h3>How did you fall for me?</h3>
<button onclick="q1()">Slowly</button>
<button onclick="q1()">All at once</button>
<button onclick="q1()">It just happened</button>
<button onclick="q1()">You hacked my heart</button>
</div>

<div id="q2" class="question hidden">
<h3>What do you do when you miss me?</h3>
<button onclick="q2()">Text me</button>
<button onclick="q2()">Think about me</button>
<button onclick="q2()">Smile like an idiot</button>
<button onclick="q2()">All of the above</button>
</div>

<div id="q3" class="question hidden">
<h3>What do you want us to do today?</h3>
<button onclick="q3()">Cute Date</button>
<button onclick="q3()">Long Drive</button>
<button onclick="q3()">Stay in & do nothing</button>
<button onclick="q3()">Surprise me</button>
</div>

<div id="q4" class="question hidden">
<h3>Do you love me?</h3>
<button onclick="loveYes()">Yes ❤️</button>
<button onclick="loveNo()">No</button>
</div>

<div id="q5" class="question hidden">
<h3>Leave a message when I'm dramatic</h3>
<textarea id="msg" rows="4" cols="30"></textarea><br>
<button onclick="aww()">Continue</button>
</div>

<div id="q6" class="question hidden">
<h3>By submitting you agree to:</h3>
<p>Love me forever 😜</p>
<button onclick="finish()">I Accept ❤️</button>
</div>

</div>

<div id="popup">
<div>
<p id="popupText"></p>
<div id="popupExtra"></div>
<button onclick="closePopup()">Continue</button>
</div>
</div>

<canvas id="fire"></canvas>

<script>
const bgm=document.getElementById("bgm");
let musicStarted=false;
let nextStep=1;

function startMusic(){
if(!musicStarted){
bgm.volume=0.6;
bgm.play().catch(()=>{});
musicStarted=true;
}
}

function showOnly(n){
for(let i=1;i<=6;i++){
let el=document.getElementById("q"+i);
if(el) el.classList.add("hidden");
}
document.getElementById("q"+n).classList.remove("hidden");
}

function popup(text,extra=""){
document.getElementById("popupText").innerHTML=text;
document.getElementById("popupExtra").innerHTML=extra;
document.getElementById("popup").style.display="flex";
}

function closePopup(){
startMusic();
document.getElementById("popup").style.display="none";
if(nextStep>0) showOnly(nextStep);
}

popup("🥂 Anniversary 2026 🥂");

function q1(){nextStep=2; popup("❤️❤️❤️");}
function q2(){nextStep=3; popup("Miss me huh ❤️");}
function q3(){nextStep=4; popup("Plan loading 😜");}

function loveNo(){nextStep=4; popup("Locked answer ❤️");}
function loveYes(){nextStep=5; popup("That's my boy ❤️");}

function aww(){
nextStep=6;
popup("Awwww 🥹❤️");
}

/* SEND EMAIL */
function finish(){
let message=document.getElementById("msg").value;

emailjs.send("YOUR_SERVICE_ID","YOUR_TEMPLATE_ID",{
message:message
}).then(function(){
console.log("Email sent");
});

nextStep=0;
popup("🎉 Happy Anniversary ❤️ 🎉");
burstFireworks();
}

/* Fireworks */
const canvas=document.getElementById("fire");
const ctx=canvas.getContext("2d");

function resize(){
canvas.width=innerWidth;
canvas.height=innerHeight;
}
resize();
window.onresize=resize;

let parts=[];

function burstFireworks(){
for(let k=0;k<8;k++){
setTimeout(()=>{
for(let i=0;i<80;i++){
parts.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height/2,
vx:(Math.random()-0.5)*10,
vy:(Math.random()-0.5)*10,
life:80
});
}
},k*200);
}
animate();
}

function animate(){
ctx.clearRect(0,0,canvas.width,canvas.height);
parts.forEach(p=>{
p.x+=p.vx;
p.y+=p.vy;
p.life--;
ctx.fillStyle="hsl("+Math.random()*360+",100%,60%)";
ctx.fillRect(p.x,p.y,5,5);
});
parts=parts.filter(p=>p.life>0);
requestAnimationFrame(animate);
}
</script>

</body>
</html>
